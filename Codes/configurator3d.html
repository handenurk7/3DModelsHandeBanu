<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <title>3D Configurator</title>

    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

    <style>
        body {
            margin: 0;
            background: #2e2e2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        model-viewer {
            width: 450px;
            height: 450px;
        }

        .buttons {
            margin-top: 15px;
        }

        button {
            margin: 5px;
            padding: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <model-viewer id="viewer" src="https://raw.githubusercontent.com/handenurk7/3DModelsHandeBanu/main/testModel3.glb"
        camera-controls auto-rotate>
    </model-viewer>

    <div class="buttons">
        <button onclick="showLegs()">Ayaklı</button>
        <button onclick="hideLegs()">Ayaksız</button>
        <button onclick="woodLight()">Açık Ahşap</button>
        <button onclick="woodDark()">Koyu Ahşap</button>
    </div>

    <script>
        const viewer = document.getElementById("viewer");

        let modelRef = null;

        // MODEL YÜKLENDİĞİNDE
        viewer.addEventListener("load", () => {
            modelRef = viewer.model;
            console.log("Model hazır");
        });

        // --------------------
        // NODE BUL (DOĞRU YÖNTEM)
        // --------------------
        function findNodeByName(name) {
            if (!modelRef) return null;

            let result = null;

            modelRef.traverse((node) => {
                if (node.name === name) {
                    result = node;
                }
            });

            return result;
        }

        // --------------------
        // AYAKLI
        // --------------------
        function showLegs() {
            const legs = findNodeByName("ayak2");

            if (legs) {
                legs.visible = true;
                console.log("Ayaklar açıldı");
            } else {
                console.log("ayak2 bulunamadı");
            }
        }

        // --------------------
        // AYAKSIZ
        // --------------------
        function hideLegs() {
            const legs = findNodeByName("ayak2");

            if (legs) {
                legs.visible = false;
                console.log("Ayaklar kapatıldı");
            } else {
                console.log("ayak2 bulunamadı");
            }
        }

        // --------------------
        // AHŞAP (placeholder - material yoksa log basar)
        // --------------------
        function woodLight() {
            changeWood("wood2");
        }

        function woodDark() {
            changeWood("wood3");
        }

        function changeWood(name) {
            if (!modelRef) return;

            const material = modelRef.materials.find(m => m.name === name);

            if (!material) {
                console.log("Material yok:", name);
                return;
            }

            console.log("Aktif ahşap:", name);
        }
    </script>

</body>

</html>
