<!DOCTYPE html>
<html>

<head>
    <title>3D Ürün Kataloğu</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

    <style>
        body {
            margin: 0;
            background: linear-gradient(135deg, #2b2b2b, #1b1b1b);
            color: white;
            font-family: 'Segoe UI', Arial;
        }

        h1 {
            text-align: center;
            padding: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            padding: 30px;
        }

        .item {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 16px;
            transition: 0.3s;
        }

        .item:hover {
            transform: translateY(-6px);
        }

        model-viewer {
            width: 100%;
            height: 300px;
            border-radius: 12px;
            background: #000;
        }

        @media (max-width: 600px) {
            .grid {
                grid-template-columns: 1fr;
                padding: 15px;
            }

            model-viewer {
                height: 280px;
            }
        }

        .title {
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
        }

        .price {
            text-align: center;
            color: #aaa;
        }

        .btn {
            display: block;
            margin: 10px auto;
            padding: 8px 18px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .modal-content {
            width: 80%;
            max-width: 900px;
            background: #111;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        .modal model-viewer {
            height: 400px;
        }

        .close {
            float: right;
            cursor: pointer;
            font-size: 22px;
        }
    </style>
</head>



<body>

    <h1>PANELON 3D KATALOG</h1>

    <div class="grid">

        <!-- ÜRÜN 1 -->
        <div class="item">
            <model-viewer src="https://raw.githubusercontent.com/Nurbanu3D/kornis-3d/main/kornis.glb" auto-rotate
                camera-controls disable-tap camera-target="0m 0m 0m"></model-viewer>
            <div class="title">Korniş</div>
            <div class="price">₺1200</div>
            <button class="btn" onclick="openModal(
            'https://raw.githubusercontent.com/Nurbanu3D/kornis-3d/main/kornis.glb',
            'Korniş',
            'Modern dekoratif korniş tasarımı.',
            '₺1200'
        )">Detay</button>
        </div>


        <!-- ÜRÜN 2 -->
        <div class="item">
            <model-viewer src="https://raw.githubusercontent.com/Nurbanu3D/2-b-lmeli/main/ikibolmeli.glb" auto-rotate
                camera-controls disable-tap camera-target="0m 0m 0m"></model-viewer>
            <div class="title">2 Bölmeli Yarım Kaplama Panel</div>
            <div class="price">₺1500</div>
            <button class="btn" onclick="openModal(
            'https://raw.githubusercontent.com/Nurbanu3D/2-b-lmeli/main/ikibolmeli.glb',
            '2 Bölmeli Yarım Kaplama Panel',
            'Fonksiyonel iki bölmeli tasarım.',
            '₺1500'
        )">Detay</button>
        </div>

        <!-- ÜRÜN 3 -->
        <div class="item">
            <model-viewer src="https://raw.githubusercontent.com/Nurbanu3D/2-b-lmeli/main/ikibolmeliwood.glb"
                auto-rotate camera-controls disable-tap camera-target="0m 0m 0m"></model-viewer>
            <div class="title">3 Bölmeli Yarım Kaplama Panel</div>
            <div class="price">₺999</div>
            <button class="btn" onclick="openModal(
            'https://raw.githubusercontent.com/Nurbanu3D/2-b-lmeli/main/ikibolmeliwood.glb',
            '3 Bölmeli Yarım Kaplama Panel',
            'Dekoratif 3D figür.',
            '₺999'
        )">Detay</button>
        </div>


        <!-- MODAL -->
        <div class="modal" id="modal">
            <div class="modal-content">
                <span class="close" onclick="closeModal()">✖</span>

                <model-viewer id="modalModel" auto-rotate camera-controls disable-tap camera-target="0m 0m 0m"></model-viewer>

                <h2 id="modalTitle"></h2>
                <p id="modalDesc"></p>
                <p id="modalPrice"></p>
            </div>
        </div>

        <script>
            function openModal(src, title, desc, price) {
                document.getElementById("modal").style.display = "flex";
                document.getElementById("modalModel").src = src;
                document.getElementById("modalTitle").innerText = title;
                document.getElementById("modalDesc").innerText = desc;
                document.getElementById("modalPrice").innerText = price;
            }

            function closeModal() {
                document.getElementById("modal").style.display = "none";
            }
        </script>

</body>

</html>
